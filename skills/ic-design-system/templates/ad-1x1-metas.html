<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ad 1:1 — Metas Lucrativas</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:1080px; height:1080px; --scale:1; --safe:88px; }
.split--photo-top { --photo: 58%; --fade: 26%; }
.split__photo .tint > img { object-position: 50% 24%; }
.headline { font-size:88px; }
.safe { gap:var(--s-5); }
</style>
</head>
<body>
<div class="canvas" data-od-id="canvas">
  <div class="split split--photo-top" aria-hidden="true">
    <div class="split__photo">
      <div class="tint" style="height:100%">
        <img src="../assets/fotos/retrato-serio-tijolo-03.jpg" width="1602" height="2400" alt="">
      </div>
    </div>
    <div class="split__body"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="safe">
    <div class="spacer"></div>
    <div class="meta-line" data-od-id="meta">
      <span>PIC® · Base 01</span><span>Metas lucrativas</span>
    </div>
    <hr class="hairline" data-od-id="rule">
    <h1 class="display headline" data-od-id="headline">
      Meta não é chute.<br><span class="hot">É equação.</span>
    </h1>
    <p class="body" data-od-id="support">
      Dez variáveis definem o número: capacidade, ticket médio, sazonalidade,
      histórico. <strong>O resto é desejo.</strong>
    </p>
    <div class="row row--between" style="margin-top:var(--s-5)" data-od-id="footer">
      <span class="plate" style="height:58px"><img src="../assets/derivadas/ic-lockup-escuro.png" width="1704" height="342" alt="Programa Inteligência Comercial"></span>
      <a class="cta" href="#" data-od-id="cta">Calcular minha meta</a>
    </div>
  </div>
</div>
</body>
</html>
