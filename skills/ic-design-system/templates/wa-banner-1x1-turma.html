<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WhatsApp — Banner 1:1 (turma nova)</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:1080px; height:1080px; --scale:1; --safe:88px; }
.split--photo-top { --photo: 56%; --fade: 26%; }
.split__photo .tint > img { object-position: 50% 18%; }
.headline { font-size:92px; }
.safe { gap:var(--s-5); }
.slots { display:flex; align-items:baseline; gap:var(--s-4); }
.slots .metric { font-size:76px; }
</style>
</head>
<body>
<div class="canvas" data-od-id="canvas">
  <div class="split split--photo-top" aria-hidden="true">
    <div class="split__photo">
      <div class="tint" style="height:100%">
        <img src="../assets/fotos/retrato-sorriso-colete.jpg" width="1602" height="2400" alt="">
      </div>
    </div>
    <div class="split__body"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="safe">
    <div class="spacer"></div>
    <div class="meta-line" data-od-id="meta">
      <span>Mentoria Inteligência Comercial</span><span>Turma 111</span>
    </div>
    <hr class="hairline" data-od-id="rule">
    <h1 class="display headline" data-od-id="headline">
      Abriu a<br><span class="hot">turma 111.</span>
    </h1>
    <div class="slots" data-od-id="proof">
      <p class="metric">3</p>
      <p class="body">dias montando a equação da meta e a cadência
      da sua operação.</p>
    </div>
    <div class="row row--between" style="margin-top:var(--s-4)" data-od-id="footer">
      <span class="plate" style="height:56px"><img src="../assets/derivadas/ic-lockup-escuro.png" width="1704" height="342" alt="Programa Inteligência Comercial"></span>
      <a class="cta" href="#" data-od-id="cta">Chamar no WhatsApp</a>
    </div>
  </div>
</div>
</body>
</html>
