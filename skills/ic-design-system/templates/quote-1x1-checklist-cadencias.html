<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Checklist 1:1 — 4 cadências</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:1080px; height:1080px; --scale:1; --safe:96px; }
.safe { justify-content:center; gap:var(--s-6); }
.t { font-size:70px; }
.check { gap:var(--s-5); }
.check li { font-size:40px; }
.check li > div .sub { font-size:24px; }
.check li::before { width:.44em; height:.44em; margin-top:.34em; }
</style>
</head>
<body>
<div class="canvas" data-od-id="canvas">
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="safe">
    <div class="meta-line" data-od-id="meta">
      <span>PIC® · Base 02</span><span>Cadências</span>
    </div>
    <div class="spacer"></div>
    <hr class="hairline" data-od-id="rule">
    <h1 class="display t" data-od-id="headline">As quatro cadências<br><span class="hot">que você precisa ter</span></h1>
    <ul class="check" data-od-id="lista">
      <li class="on"><div><b>Entrada</b><span class="sub">Lead novo · até 30 atividades</span></div></li>
      <li class="on"><div><b>Agenda</b><span class="sub">Conexão até marcar a reunião</span></div></li>
      <li class="on"><div><b>Oportunidade</b><span class="sub">Follow-up da proposta na mesa</span></div></li>
      <li class="on"><div><b>Base e embaixadores</b><span class="sub">Retenção e indicação ativa</span></div></li>
    </ul>
    <div class="spacer"></div>
    <div class="row row--between" data-od-id="footer">
      <p class="caption">Confere na sua operação.</p>
      <span class="plate" style="height:58px"><img src="../assets/derivadas/ic-lockup-escuro.png" width="1704" height="342" alt="Programa Inteligência Comercial"></span>
    </div>
  </div>
</div>
</body>
</html>
