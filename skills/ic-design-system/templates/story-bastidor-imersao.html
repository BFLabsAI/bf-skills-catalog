<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story — Bastidor da imersão</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:1080px; height:1920px; --scale:1; --safe:96px; }
.safe { top:250px; bottom:250px; }
.bg img { object-position: 50% 40%; }
.headline { font-size: calc(84px * var(--scale)); }
</style>
</head>
<body>
<div class="canvas" data-od-id="canvas">
  <div class="bg" aria-hidden="true">
    <img class="photo-grade" src="../assets/fotos/palco-telao-pic.jpg" width="2400" height="1800" alt="">
  </div>
  <div class="veil" aria-hidden="true"></div>
  <div class="dead-top" aria-hidden="true"></div>
  <div class="dead-bottom" aria-hidden="true"></div>
  <div class="safe">
    <p class="eyebrow" data-od-id="eyebrow">Bastidor · Imersão PIC</p>
    <div class="spacer"></div>
    <div class="stack" data-od-id="main">
      <h1 class="display headline" data-od-id="headline">
        Três dias<br><span class="hot">desenhando funil.</span>
      </h1>
      <p class="body" data-od-id="support">
        Sem palestra motivacional. Sai com a equação da meta preenchida
        e a cadência montada.
      </p>
    </div>
    <div class="spacer"></div>
    <span class="plate start" style="height:64px" data-od-id="brand"><img src="../assets/derivadas/ic-lockup-escuro.png" width="1704" height="342" alt="Programa Inteligência Comercial"></span>
  </div>
</div>
</body>
</html>
