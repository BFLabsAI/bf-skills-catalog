<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ad 4:5 — Follow-up</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:1080px; height:1350px; --scale:1; --safe:88px; }
.split--photo-top { --photo: 54%; --fade: 26%; }
.split__photo .tint > img { object-position: 52% 20%; }
.headline { font-size:98px; }
.proof { display:flex; align-items:baseline; gap:var(--s-5); }
.proof .metric { font-size:104px; }
.proof p { max-width:20ch; }
.safe { gap:var(--s-5); }
</style>
</head>
<body>
<div class="canvas" data-od-id="canvas">
  <div class="split split--photo-top" aria-hidden="true">
    <div class="split__photo">
      <div class="tint" style="height:100%">
        <img src="../assets/fotos/retrato-jaqueta-vermelha.jpg" width="1602" height="2400" alt="">
      </div>
    </div>
    <div class="split__body"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="safe">
    <div class="spacer"></div>
    <div class="meta-line" data-od-id="meta">
      <span>PIC® · Base 04</span><span>Performance por indicadores</span>
    </div>
    <hr class="hairline" data-od-id="rule">
    <h1 class="display headline" data-od-id="headline">
      Seu vendedor para no<br><span class="hot">segundo contato.</span>
    </h1>
    <div class="proof" data-od-id="proof">
      <p class="metric">80%</p>
      <p class="body">das vendas acontecem entre o <strong>5º e o 12º contato</strong>.
      Quem para antes deixa o faturamento na mesa.</p>
    </div>
    <div class="row row--between" style="margin-top:var(--s-5)" data-od-id="footer">
      <span class="plate" style="height:62px"><img src="../assets/derivadas/ic-lockup-escuro.png" width="1704" height="342" alt="Programa Inteligência Comercial"></span>
      <a class="cta" href="#" data-od-id="cta">Inscreva-se agora</a>
    </div>
  </div>
</div>
</body>
</html>
