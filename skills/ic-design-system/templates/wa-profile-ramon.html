<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WhatsApp — Foto de perfil (Ramon)</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:640px; height:640px; --scale:.6; }
.bg img { object-position: 50% 22%; }
/* Recorte circular do app: nada fora do círculo inscrito. */
.ring { position:absolute; inset:0; border-radius:var(--r-pill);
  box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 8px var(--accent); }
</style>
</head>
<body>
<div class="canvas circle-mask" data-od-id="canvas">
  <div class="bg" aria-hidden="true">
    <img src="../assets/derivadas/ramon-rosto-serio-640.jpg" width="640" height="640"
         alt="Ramon Pessoa">
  </div>
  <div class="ring" aria-hidden="true"></div>
</div>
</body>
</html>
