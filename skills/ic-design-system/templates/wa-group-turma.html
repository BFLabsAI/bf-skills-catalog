<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WhatsApp — Foto de grupo (turma)</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="_layout.css">
<style>
.canvas { width:640px; height:640px; --scale:.6; }
.g-mark { height:150px; } .g-mark img { height:100%; width:auto; display:block; }
.g-title { font-family:var(--font-display); font-variation-settings:"wdth" 70,"wght" 800;
  text-transform:uppercase; font-size:62px; line-height:.94; color:var(--fg); margin:22px 0 0; }
.g-sub { font-family:var(--font-mono); font-size:24px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin:12px 0 0; }
.ring { position:absolute; inset:0; border-radius:var(--r-pill);
  box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 8px var(--border); }
</style>
</head>
<body>
<div class="canvas circle-mask" data-od-id="canvas">
  <div class="circle-safe">
    <span class="g-mark" aria-hidden="true"><img src="../assets/derivadas/ic-simbolo-escuro.png" width="614" height="375" alt="Inteligência Comercial"></span>
    <p class="g-title" data-od-id="title">Turma<br>110</p>
    <p class="g-sub" data-od-id="sub">Mentoria IC</p>
  </div>
  <div class="ring" aria-hidden="true"></div>
</div>
</body>
</html>
